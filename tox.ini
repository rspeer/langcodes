[tox]
envlist = py36, py37, py38, py39, py310, py311, py312, p313
skipsdist = True

[testenv]
deps =
    pytest
    marisa_trie
    language_data
commands = pip install .
           pytest

[testenv:docs]
deps =
    sphinx
    sphinx-book-theme
    myst-parser
    sphinx-copybutton
    language_data
commands =
    sphinx-build -aEWnb html docs docs/build/html
